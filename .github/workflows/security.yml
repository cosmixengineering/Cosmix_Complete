name: Cosmix ERP Security & Secret Scanning

on:
  push:
    branches: [main, develop, 'codex/**', 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Gitleaks Repository-Wide Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install checksum-pinned Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cosmix-gitleaks"
          cd "$RUNNER_TEMP/cosmix-gitleaks"
          curl --fail --location --silent --show-error -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan entire Git history with 100% value redaction
        run: >-
          "$RUNNER_TEMP/cosmix-gitleaks/gitleaks" git --redact=100
          --report-format json --report-path "$RUNNER_TEMP/gitleaks-redacted.json"
          --log-opts="--all" .

      - name: Upload redacted secret scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-redacted-report
          path: ${{ runner.temp }}/gitleaks-redacted.json
          retention-days: 14

  codeql-analysis:
    name: CodeQL Static Security Analysis
    if: vars.COSMIX_CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL for C#
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Build backend for CodeQL
        working-directory: cosmix-backend
        run: |
          dotnet restore Cosmix.Backend.sln --locked-mode
          dotnet build Cosmix.Backend.sln -c Release --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
