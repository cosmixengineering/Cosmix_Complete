name: Verify frontend
on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node --test scripts/evidence-record.test.mjs scripts/payroll-readiness.test.mjs
      - run: npm audit --audit-level=high
