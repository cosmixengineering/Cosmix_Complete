title = "Cosmix source secret scanning"
[extend]
useDefault = true

[[allowlists]]
description = "Generated output and installed third-party dependencies; application source and fixtures remain scanned."
paths = [
  '''(^|[\\/])(node_modules|bin|obj|build|dist|Pods|\.gradle|\.cxx|\.git|\.vs)([\\/]|$)'''
]


[[allowlists]]
description = "Exact public browser storage namespace, not a credential."
regexTarget = "secret"
regexes = ['''^cosmix_erp_notifications_v2$''']
