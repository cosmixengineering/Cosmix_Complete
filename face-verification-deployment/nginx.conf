# CompreFace 1.2.0 routes, with private TLS, no biometric request spooling/logging,
# no wildcard CORS, bounded requests, and read-only core status for UI bootstrap.
user nginx;
worker_processes 1;
error_log /dev/stderr crit;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_max_body_size 3m;
    client_body_buffer_size 3m;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_req_zone $binary_remote_addr zone=face_requests:1m rate=10r/s;

    upstream frsadmin { server compreface-admin:8080; }
    upstream frsapi { server compreface-api:8080; }
    upstream frscore { server compreface-core:3000; }

    server {
        listen 80;
        listen 443 ssl;
        server_name 192.168.1.50 ubuntu;
        ssl_certificate /etc/nginx/cosmix-tls/server.crt;
        ssl_certificate_key /etc/nginx/cosmix-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        limit_req zone=face_requests burst=20 nodelay;
        limit_req_status 429;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html =404;
        }
        location /admin/ {
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://frsadmin/admin/;
        }
        location /api/v1/ {
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_pass http://frsapi/api/v1/;
        }
        # CompreFace 1.2.0's login waits for this real status/plugin response.
        location = /core/status {
            limit_except GET { deny all; }
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
            proxy_buffering off;
            proxy_pass http://frscore/status;
        }
        location /core/ { return 404; }
    }
}
