name: Security checks
on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cosmix-gitleaks"
          cd "$RUNNER_TEMP/cosmix-gitleaks"
          curl --fail --location --silent --show-error -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan Git history without exposing secret values
        run: '"$RUNNER_TEMP/cosmix-gitleaks/gitleaks" git --redact=100 --report-format json --report-path "$RUNNER_TEMP/gitleaks-redacted.json" --log-opts="--all" .'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redacted-secret-scan
          path: ${{ runner.temp }}/gitleaks-redacted.json
          retention-days: 7
  codeql:
    # Enable only after confirming CodeQL entitlement for this private repository.
    if: vars.COSMIX_CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet restore Cosmix.Backend.sln --locked-mode
      - run: dotnet build Cosmix.Backend.sln -c Release --no-restore
      - uses: github/codeql-action/analyze@v4

